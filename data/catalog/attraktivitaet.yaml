# Attraktivität der Katalogorte (Aufgabe 8, docs/logik/orts-attraktivitaet.md).
# KI-Entwurf, redaktionelle Prüfung ausstehend (wie der ganze Katalog, BG-11).
# Je Ort zwei von Hand eingeschätzte Kriterien, jeweils 0–3:
#   [bekanntheit, attraktionen]
#   bekanntheit:  3 = bekannter Urlaubsort mit viel Tourismus, 2 = beliebter Urlaubsort, 1 = eher unbekannt
#   attraktionen: Bergbahnen, Gondeln, Skigebiet oder große Sehenswürdigkeiten vor Ort
#                 3 = mehrere bedeutende, 2 = eine bedeutende oder mehrere kleinere, 1 = kleinere, 0 = keine
# Die übrigen Kriterien (Wander- und Radwege, Vielfalt, Infrastruktur) berechnet
# `packages/domain/src/attractiveness.ts` aus den Themen und der Einwohnerzahl.

# PR gate (architektur.md 13, O1.2): supply chain, typecheck, tests, build,
# claims rule, STATUS rows, tree unchanged, secret scan.
# Event-driven only (no schedules, company directive).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Supply-chain check and allowlisted rebuild
        run: node scripts/supply-chain-check.mjs --rebuild

      - name: Generate (config, domain data, skills)
        run: npm run gen

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (hermetic)
        run: npm test

      - name: pgTAP (RLS, RPCs, constraints)
        run: npm run db:test

      - name: Claims rule
        run: npm run check:claims

      - name: STATUS rows
        run: npm run check:status

      - name: Build
        run: npm run build

      - name: Tree unchanged after build and test
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --config .gitleaks.toml --no-banner .
          rm -f gitleaks gitleaks.tar.gz
